services:
  early-warning-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocational-early-warning
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Persistent SQLite volume for institutional training records
      - ./prisma:/app/prisma
      - ./data_exports:/app/data_exports
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
